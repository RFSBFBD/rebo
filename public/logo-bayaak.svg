<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BF953F" />
      <stop offset="35%" stop-color="#FCF6BA" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA8221" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B192C" />
      <stop offset="100%" stop-color="#06101E" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Base Shield/Rounded Hexagon -->
  <rect x="5" y="5" width="90" height="90" rx="26" fill="url(#navyGrad)" stroke="url(#goldGrad)" stroke-width="3" />
  <!-- Inner Golden Ring -->
  <circle cx="50" cy="50" r="34" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.6"/>
  <!-- Stylized B / Arabic Baa with Golden Diamond Dot -->
  <path d="M30 38 C 30 32, 70 32, 70 38 C 70 46, 50 48, 50 64 L 32 64 C 32 54, 45 48, 45 42" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Diamond Dot -->
  <polygon points="50,72 54,77 50,82 46,77" fill="url(#goldGrad)" filter="url(#glow)" />
  <circle cx="68" cy="38" r="3" fill="#FCF6BA" />
</svg>
